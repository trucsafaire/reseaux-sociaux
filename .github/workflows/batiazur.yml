name: Bati Azur (publication automatique)
# Chaque matin, toute l'année : story « Météo piscine » (filtration conseillée, hivernage actif,
# alertes gel / canicule / orage) sur Facebook et Instagram. Tourne dans le cloud GitHub.
# Créneaux de secours : un jour déjà publié n'est jamais republié.
on:
  schedule:
    - cron: "7 6 * * *"     # 7 h 07 Paris (hiver), 8 h 07 en été
    - cron: "41 7 * * *"    # secours
    - cron: "23 9 * * *"    # secours
  workflow_dispatch:
    inputs:
      moment: { description: "meteo", required: true, default: "meteo" }
      essai: { description: "Essai : préparer sans publier", type: boolean, default: false }
      forcer: { description: "Republier même si déjà fait aujourd'hui", type: boolean, default: false }
permissions:
  contents: write
concurrency: { group: batiazur, cancel-in-progress: false }
jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_TOKEN: ${{ secrets.META_TOKEN }}
      URL_IMAGES: https://raw.githubusercontent.com/${{ github.repository }}/batiazur-images
      MOMENT: ${{ inputs.moment || 'meteo' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: social/package-lock.json }
      - run: cd social && npm ci --no-audit --no-fund
      - name: Récupérer l'historique
        run: git fetch -q origin batiazur-images 2>/dev/null && git show origin/batiazur-images:historique.json > social/batiazur/historique.json 2>/dev/null || true
      - name: Déjà fait aujourd'hui ?
        id: fait
        run: |
          J=$(TZ=Europe/Paris date +%F)
          if [ "${{ inputs.forcer }}" != "true" ] && [ -f social/batiazur/historique.json ] && grep -q "\"$J-$MOMENT\"" social/batiazur/historique.json; then echo "oui=1" >> $GITHUB_OUTPUT; echo "Déjà publié aujourd'hui."; fi
      - name: Préparer
        if: ${{ !steps.fait.outputs.oui }}
        run: node social/batiazur/lancer.mjs preparer "$MOMENT"
      - name: Mettre les images en ligne (branche batiazur-images)
        if: ${{ !steps.fait.outputs.oui }}
        run: |
          rm -rf /tmp/b && mkdir -p /tmp/b/$MOMENT && cp social/batiazur/sortie/$MOMENT/*.png /tmp/b/$MOMENT/
          [ -f social/batiazur/historique.json ] && cp social/batiazur/historique.json /tmp/b/ || echo '{}' > /tmp/b/historique.json
          cd /tmp/b && git init -q -b batiazur-images && git add -A
          git -c user.name="batiazur-bot" -c user.email="bati.azur03@gmail.com" commit -qm "Bati Azur $MOMENT $(date +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" batiazur-images
          sleep 15
      - name: Publier
        if: ${{ !steps.fait.outputs.oui && !inputs.essai }}
        run: node social/batiazur/lancer.mjs publier "$MOMENT" ${{ inputs.forcer && '--forcer' || '' }}
      - name: Enregistrer l'historique
        if: ${{ always() && !steps.fait.outputs.oui && !inputs.essai }}
        run: |
          [ -f social/batiazur/historique.json ] || exit 0
          cp social/batiazur/historique.json /tmp/b/historique.json && cd /tmp/b && git add -A
          git -c user.name="batiazur-bot" -c user.email="bati.azur03@gmail.com" commit -qm "Historique Bati Azur $(date +%F)" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" batiazur-images
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: batiazur-${{ env.MOMENT }}
          path: social/batiazur/sortie/
          retention-days: 14
          if-no-files-found: ignore
