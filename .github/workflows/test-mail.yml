name: Test d'une adresse de redirection (manuel)
# Envoie un e-mail de test directement au serveur de messagerie du domaine (sans compte mail).
on:
  workflow_dispatch:
    inputs:
      a: { description: "Adresse à tester (ex. insta44@trucsafaire.fr)", required: true }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install -q dnspython
      - shell: python
        env: { A: "${{ inputs.a }}" }
        run: |
          import os, smtplib, dns.resolver, email.utils
          from email.message import EmailMessage
          a = os.environ["A"]; dom = a.split("@")[1]
          mx = sorted(dns.resolver.resolve(dom, "MX"), key=lambda r: r.preference)
          m = EmailMessage()
          m["From"] = f"Test Trucs a faire <test@{dom}>"; m["To"] = a
          m["Subject"] = f"Test de redirection {a}"; m["Date"] = email.utils.formatdate(localtime=True)
          m["Message-ID"] = email.utils.make_msgid(domain=dom)
          m.set_content(f"Ceci est un e-mail de test envoyé à {a}. S'il est arrivé, la redirection fonctionne.")
          for r in mx:
            h = str(r.exchange).rstrip(".")
            try:
              with smtplib.SMTP(h, 25, timeout=20) as s:
                s.ehlo("github.com"); 
                try: s.starttls(); s.ehlo("github.com")
                except Exception as e: print("pas de TLS", e)
                print(s.send_message(m)); print("envoyé via", h); break
            except Exception as e: print("échec", h, e)
          else: raise SystemExit("aucun serveur n'a accepté")
